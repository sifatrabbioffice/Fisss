name: "Godot iOS Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o game_project.zip -d project_folder

      - name: Download and Setup Godot & Export Templates
        run: |
          # 1. Godot Engine download & setup
          curl -L -o Godot.zip https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_macos.universal.zip
          unzip Godot.zip
          mv Godot.app /Applications/Godot.app
          echo "/Applications/Godot.app/Contents/MacOS" >> $GITHUB_PATH

          # 2. Godot Export Templates download
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          
          # Rename to .zip so unzip handles it cleanly
          mv templates.tpz templates.zip
          unzip templates.zip

          # 3. Correctly place the export templates where Godot looks for them
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.2.1.stable"
          mv templates/* "$HOME/Library/Application Support/Godot/export_templates/4.2.1.stable/"

      - name: Import Godot Project Resources
        run: |
          # গডোট ৪.২ এর জন্য প্রজেক্ট রিসোর্স আগে মেমোরিতে প্রিপেয়ার করা বাধ্যতামূলক
          Godot --headless --path project_folder/ --editor --quit || true

      - name: Godot Export to iOS Xcode Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ios"
          
          # প্রজেক্ট পাথ রিলিজ মোডে এক্সপোর্ট করা হচ্ছে 
          Godot --headless --path project_folder/ --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/game_project.xcodeproj"
          
          echo "=== Exported Build Directory Contents ==="
          ls -la "$GITHUB_WORKSPACE/build/ios"

      - name: Build Xcode Project (Unsigned with Full Engine & Data)
        run: |
          OUTPUT_DIR="$GITHUB_WORKSPACE/build/ios/output"
          mkdir -p "$OUTPUT_DIR"
          
          cd "$GITHUB_WORKSPACE/build/ios"
          
          XCODE_PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          
          if [ -z "$XCODE_PROJ" ]; then
            echo "❌ Error: No .xcodeproj found! The Godot export step likely failed."
            exit 1
          fi
          
          SCHEME_NAME="${XCODE_PROJ%.xcodeproj}"
          
          echo "🚀 Found Project: $XCODE_PROJ"
          echo "🚀 Using Scheme Name: $SCHEME_NAME"
          
          # Xcode 16+ এ আনসাইন্ড বিল্ড সফল করার জন্য ফিক্সড প্যারামিটারসমূহ
          xcodebuild -project "$XCODE_PROJ" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            VALIDATE_PRODUCT=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            SUPPRESS_REASON_TO_NOT_SIGN=YES \
            CONFIGURATION_BUILD_DIR="$OUTPUT_DIR" \
            clean build

      - name: Convert .app to .ipa (Payload Packing)
        run: |
          cd "$GITHUB_WORKSPACE/build/ios/output"
          mkdir -p Payload
          
          if ls *.app 1> /dev/null 2>&1; then
            mv *.app Payload/
            # আনসাইন্ড আইপিএ জিপ ফরম্যাটে কম্প্রেস করা হচ্ছে
            zip -r game_project_unsigned.ipa Payload
            rm -rf Payload
            echo "✅ Successfully created game_project_unsigned.ipa"
          else
            echo "❌ Error: .app bundle not found! Xcode build failed."
            exit 1
          fi

      - name: Upload Unsigned .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/output/game_project_unsigned.ipa
