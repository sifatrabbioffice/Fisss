name: "Godot iOS Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o game_project.zip -d project_folder
          
      - name: Download and Setup Godot & Export Templates
        run: |
          # ১. গডট ইঞ্জিন ডাউনলোড ও সেটআপ
          curl -L -o Godot.zip https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_macos.universal.zip
          unzip Godot.zip
          mv Godot.app /Applications/Godot.app
          echo "/Applications/Godot.app/Contents/MacOS" >> $GITHUB_PATH
          
          # ২. গডট এক্সপোর্ট টেমপ্লেট ডাউনলোড
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip templates.tpz
          
          # ৩. আইওএস টেমপ্লেটটি নির্দিষ্ট ফোল্ডারে মুভ করা
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.2.1.stable"
          mv templates/ios.zip "$HOME/Library/Application Support/Godot/export_templates/4.2.1.stable/ios.zip"

      - name: Godot Export to iOS
        run: |
          # প্রজেক্টের ভেতরে এক্সপোর্ট ফোল্ডার তৈরি
          mkdir -p project_folder/build/ios
          # গডট দিয়ে রিয়েল প্যাকড এক্সকোড প্রোজেক্ট এক্সপোর্ট
          Godot --headless --path project_folder/ --export-release "iOS" ./build/ios/igame.xcodeproj
          
          # ফাইল মেইন বিল্ড ডিরেক্টরিতে মুভ করা
          mkdir -p build/ios
          cp -R project_folder/build/ios/ build/ios/

      - name: Build Xcode Project (Unsigned with Game Data)
        run: |
          cd build/ios
          # এক্সকোড দিয়ে সমস্ত ৩ডি ক্যামেরা ও অ্যাসেট সহ ফুল কম্পাইল করা
          xcodebuild -project igame.xcodeproj \
            -scheme igame \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="./output" \
            clean build

      - name: Convert .app to .ipa (Payload Packing)
        run: |
          cd build/ios/output
          mkdir Payload
          mv *.app Payload/
          zip -r igame_unsigned.ipa Payload
          rm -rf Payload

      - name: Upload Unsigned .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/output/igame_unsigned.ipa
