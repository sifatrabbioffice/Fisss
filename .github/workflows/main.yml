name: "Godot iOS Build"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      GODOT_VERSION: "4.2.1"
      PROJECT_NAME: "game_project"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Locate Project Root
        run: |
          if [ -f "game_project.zip" ]; then
            echo "✅ game_project.zip found! Extracting..."
            unzip -o game_project.zip -d extracted_content
            
            PROJECT_ROOT=$(find extracted_content -name "project.godot" -exec dirname {} \;)
            if [ -z "$PROJECT_ROOT" ]; then
              echo "❌ Error: 'project.godot' file not found inside the zip!"
              exit 1
            fi
            echo "🎯 Found project.godot path at: $PROJECT_ROOT"
            
            mkdir -p project_folder
            mv "$PROJECT_ROOT"/* project_folder/ 2>/dev/null || true
            if [ -d "$PROJECT_ROOT"/.godot ]; then mv "$PROJECT_ROOT"/.godot project_folder/ 2>/dev/null || true; fi
          else
            echo "❌ Error: game_project.zip not found in repository root!"
            exit 1
          fi

      - name: Cache Godot Editor and Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
            /Applications/Godot.app
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}

      - name: Download & Install Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "🤖 Downloading Godot v${{ env.GODOT_VERSION }}..."
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          rm Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip

      - name: Download & Install Godot Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "📦 Downloading Export Templates..."
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          rm Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz

      - name: Auto-Generate Export Presets
        run: |
          # গডোটের সাইলেন্ট এক্সপোর্ট ফেইলুর আটকাতে প্রজেক্ট ফোল্ডারের ভেতরেই পাথ সেট করা হয়েছে
          rm -f project_folder/export_presets.cfg
          echo "📝 Writing custom export_presets.cfg directly inside the target layout..."
          cat <<EOF > project_folder/export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_files"
          include_filter=""
          exclude_filter=""
          export_path="ios_build/game_project.xcodeproj"
          EOF

      - name: Import Godot Project Resources
        run: |
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path project_folder/ --editor --quit || true

      - name: Godot Export Xcode Project
        run: |
          # গডোট যাতে পাথ ডিটেক্ট করতে পারে, সেজন্য প্রজেক্ট ফোল্ডারের ভেতরেই আউটপুট ডিরেক্টরি তৈরি করা হয়েছে
          mkdir -p project_folder/ios_build
          echo "🚀 Exporting Godot project to Xcode..."
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path project_folder/ --export-release "iOS" "ios_build/${{ env.PROJECT_NAME }}.xcodeproj"

      - name: Relocate and Verify Export Success
        run: |
          # এক্সপোর্ট করা ফাইলগুলোকে মূল বিল্ড ডিরেক্টরিতে সরিয়ে আনা হচ্ছে
          mkdir -p "$GITHUB_WORKSPACE/ios_build"
          mv project_folder/ios_build/* "$GITHUB_WORKSPACE/ios_build/" 2>/dev/null || true
          
          echo "=== Checking exported files ==="
          ls -la "$GITHUB_WORKSPACE/ios_build"
          if [ ! -d "$GITHUB_WORKSPACE/ios_build/${{ env.PROJECT_NAME }}.xcodeproj" ]; then
            echo "❌ Error: Godot failed to create the Xcode project directory!"
            exit 1
          fi

      - name: Build Xcode Project (Simulator / No Signing)
        run: |
          cd "$GITHUB_WORKSPACE/ios_build"
          
          echo "🛠️ Compiling Xcode Project..."
          xcodebuild \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.PROJECT_NAME }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            VALIDATE_PRODUCT=NO

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: ios_build/
