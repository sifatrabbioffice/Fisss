name: "Godot iOS Build"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: unzip -o game_project.zip -d project_folder

      - name: Verify Export Presets
        run: |
          if [ ! -f project_folder/export_presets.cfg ]; then
            echo "❌ export_presets.cfg not found!"
            exit 1
          fi
          grep -q 'name="iOS"' project_folder/export_presets.cfg || \
            (echo "❌ iOS preset missing in export_presets.cfg" && exit 1)
          echo "✅ export_presets.cfg OK"

      - name: Download and Setup Godot & Export Templates
        run: |
          set -e
          
          # Godot ডাউনলোড
          curl -L -o Godot.zip \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_macos.universal.zip
          unzip -q Godot.zip
          mv Godot.app /Applications/Godot.app
          echo "/Applications/Godot.app/Contents/MacOS" >> $GITHUB_PATH
          
          # Export Templates ডাউনলোড
          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip -q templates.tpz
          
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.2.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/ios.zip "$TEMPLATE_DIR/ios.zip"
          echo "✅ Templates installed"

      - name: Godot Export to iOS
        run: |
          set -e
          mkdir -p build/ios
          
          Godot --headless \
            --path "$GITHUB_WORKSPACE/project_folder/" \
            --export-release "iOS" \
            "$GITHUB_WORKSPACE/build/ios/igame.xcodeproj"
          
          echo "✅ Export complete"
          ls -la build/ios/

      - name: Build Xcode Project (Unsigned)
        run: |
          set -e
          cd build/ios
          
          # Scheme নাম automatically বের করা
          SCHEME=$(xcodebuild -project igame.xcodeproj -list \
            | awk '/Schemes:/{found=1; next} found && NF{print $1; exit}')
          echo "Using scheme: $SCHEME"
          
          xcodebuild -project igame.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="./output" \
            clean build

      - name: Convert .app to .ipa
        run: |
          set -e
          cd build/ios/output
          mkdir Payload
          mv *.app Payload/
          zip -r igame_unsigned.ipa Payload
          rm -rf Payload
          echo "✅ IPA created: $(ls -lh igame_unsigned.ipa)"

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/output/igame_unsigned.ipa
