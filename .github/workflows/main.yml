name: "Godot iOS Build"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      GODOT_VERSION: "4.2.1"
      PROJECT_NAME: "game_project"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify and Unzip Project Files
        run: |
          if [ -f "game_project.zip" ]; then
            echo "✅ game_project.zip found! Extracting..."
            unzip -o game_project.zip -d project_folder
          else
            echo "❌ Error: game_project.zip not found in the repository root!"
            echo "Please make sure your zip file name is exactly 'game_project.zip'"
            exit 1
          fi

      - name: Cache Godot Editor and Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
            /Applications/Godot.app
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}

      - name: Download & Install Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "🤖 Downloading Godot v${{ env.GODOT_VERSION }}..."
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          rm Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip

      - name: Download & Install Godot Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "📦 Downloading Export Templates..."
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz -d /tmp
          mv /tmp/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          rm Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz

      - name: Import Godot Project Resources
        run: |
          # গডোটের ইন্টারনাল ফাইল এবং ফাইলসিস্টেম ক্যাশ জেনারেট করার জন্য
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path project_folder/ --editor --quit || true

      - name: Auto-Generate Export Presets if Missing
        run: |
          # যদি আপনার জিপের ভেতর export_presets.cfg না থাকে, তবে এই কমান্ডটি স্বয়ংক্রিয়ভাবে একটি iOS প্রিসেট বানিয়ে দেবে
          if [ ! -f "project_folder/export_presets.cfg" ]; then
            echo "⚠️ export_presets.cfg missing! Creating a temporary iOS preset..."
            cat <<EOF > project_folder/export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_files"
          include_filter=""
          exclude_filter=""
          export_path="../ios_build/game_project.xcodeproj"
          EOF
          fi

      - name: Godot Export Xcode Project
        run: |
          mkdir -p ios_build
          echo "🚀 Exporting Godot project to Xcode..."
          # গডোট হেডলেস মোডে আপনার জন্য game_project.xcodeproj তৈরি করবে
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path project_folder/ --export-release "iOS" "$GITHUB_WORKSPACE/ios_build/${{ env.PROJECT_NAME }}.xcodeproj"

      - name: Verify Export Success
        run: |
          echo "=== Checking exported files ==="
          ls -la "$GITHUB_WORKSPACE/ios_build"
          if [ ! -d "$GITHUB_WORKSPACE/ios_build/${{ env.PROJECT_NAME }}.xcodeproj" ]; then
            echo "❌ Error: Godot failed to create the Xcode project directory!"
            exit 1
          fi

      - name: Build Xcode Project (Simulator / No Signing)
        run: |
          cd ios_build
          
          echo "🛠️ Compiling Xcode Project..."
          xcodebuild \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.PROJECT_NAME }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -quiet \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            VALIDATE_PRODUCT=NO

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: ios_build/
